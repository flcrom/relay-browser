[supervisord]
nodaemon=true
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -ac
priority=10
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
priority=20
[program:chromium]
command=/usr/bin/chromium --no-sandbox --disable-dev-shm-usage --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --user-data-dir=/data/chrome --start-maximized about:blank
environment=DISPLAY=":99"
priority=30
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
priority=40
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=50
